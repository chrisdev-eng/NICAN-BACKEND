version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nicandb
    environment:
      POSTGRES_DB: nicandb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: