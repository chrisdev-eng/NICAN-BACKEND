version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: nicandb
    environment:
      POSTGRES_DB: nicandb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nicandb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
